# Example sorting profile.
#
# A profile is a list of categories, each with a priority number of its
# own. A piece goes to the accepting category with the lowest number.
# A category has exactly one of 'accept' (rules), 'list' (wanted
# quantities) or 'catch_all: true'. A piece that no category
# accepts is rejected. Misspelled keys are errors, not ignored.

name: sample
# Part numbers, part category names and color names below follow this
# scheme. Only Rebrickable is supported so far.
default_naming_scheme: Rebrickable

categories:
  - name: blue 2x4 and 1x2 bricks
    priority: 1                    # 0 is the highest priority; default is 256
    accept:
      parts: [3001, 3004]
      colors: [Blue]               # color names or ids; leave out for any color

  - name: tiles
    priority: 2
    accept:
      parts: [96489]
      part_categories: [Tiles]     # a whole catalog category
    reject:                        # reject wins over accept, including
      parts: [101645]              # parts that came in through a category

  - name: bricks
    priority: 3
    accept:
      part_categories: [Bricks]
      colors: any
    reject:
      colors: [Black]

  - name: bricks and tiles in red
    priority: 0
    accept:
      categories: [bricks, tiles]  # everything those two categories accept
      colors: [Red]

  - name: parts for a build
    priority: 4
    list:                          # wants: each entry takes pieces until its
      source: {note: "for a build"}  # quantity is delivered, then the next
      entries:                     # category by priority gets them
        - {part: "3001", color: Black, quantity: 10}
        - {part: "3004", color: Black, quantity: 6}
        - {part: "3020", color: any, quantity: 4}   # any color, counted together

  - name: identified, not wanted   # every piece no category above took;
    priority: 10                   # must have the largest priority number
    catch_all: true

# Bins kept free for overflow from full bins. Categories plus overflow
# bins may not exceed the number of sort bins on the machine.
overflow_bins: 1
